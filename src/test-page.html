<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Kilo Agent Test Page</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 24px;
      background: #0f172a;
      color: #f1f5f9;
    }
    h1 { font-size: 24px; margin-bottom: 24px; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 14px;
      margin-bottom: 16px;
    }
    input:focus, textarea:focus, select:focus { outline: 2px solid #0284c7; border-color: #0284c7; }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #0284c7;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #0369a1; }
    .secondary-btn { background: #334155; }
    .secondary-btn:hover { background: #475569; }
    a { color: #38bdf8; font-size: 13px; }
  </style>
</head>
<body>
  <h1>🧪 Apex Kilo Agent Test Page</h1>

  <div class="card">
    <h2 style="font-size:18px; margin-bottom:16px; color:#38bdf8;">Search Products</h2>
    <label for="searchBox">What are you looking for?</label>
    <input id="searchBox" type="search" name="search_query" placeholder="Enter product name..." />
    <button id="searchBtn" type="button" class="secondary-btn" style="width:auto; margin-bottom:0;">Search</button>
  </div>

  <div class="card">
    <h2 style="font-size:18px; margin-bottom:16px; color:#38bdf8;">Contact Form</h2>
    <label for="contactName">Name</label>
    <input id="contactName" type="text" name="name" placeholder="Your name" />

    <label for="contactEmail">Email</label>
    <input id="contactEmail" type="email" name="email" placeholder="you@example.com" />

    <label for="contactMessage">Message</label>
    <textarea id="contactMessage" name="message" placeholder="Your message..." rows="3"></textarea>

    <button id="submitBtn" type="submit" style="width:auto;">Send Message</button>
  </div>

  <div class="card">
    <h2 style="font-size:18px; margin-bottom:16px; color:#38bdf8;">Quick Actions</h2>
    <a href="#" id="navLink">Go to Settings</a>
    <button id="clearBtn" type="button" class="secondary-btn" style="width:auto; margin-top:12px;">Clear All Fields</button>
  </div>
</body>
</html>
